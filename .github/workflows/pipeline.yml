name: Hourly medallion pipeline

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: live-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      - name: Restore warehouse and bronze from live-data branch
        run: |
          mkdir -p data docs/data
          if git fetch --depth 1 origin live-data; then git archive FETCH_HEAD | tar -x -C .; fi
          ls -la data || true

      - name: Run pipeline (extract → bronze → silver → dbt build → quality → analytics → publish)
        run: python -m quake.pipeline

      - name: Save warehouse to live-data branch
        run: |
          STATE=$(mktemp -d)
          cp -r data "$STATE/data"
          mkdir -p "$STATE/docs" && cp -r docs/data "$STATE/docs/data"
          cd "$STATE"
          git init -q -b live-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Warehouse state $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" live-data

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
